# Strategy / risk parameters. Safe to edit and version-control -- no
# secrets live here (those go in .env). Every value here has a hard safety
# ceiling enforced in bot/config.py that this file cannot override.

capital:
  # Starting capital assumption in USD. Only used to size the very first
  # trade in DRY_RUN; in LIVE mode the bot always reads your real account
  # equity from the exchange instead.
  initial_capital_usd: 50.0

  # % of CURRENT equity risked on a single trade (distance to stop-loss x
  # position size). 2% of $50 = $1 at risk per trade.
  risk_per_trade_pct: 2.0

  # Hard cap on leverage, regardless of what position sizing computes.
  # Kept low on purpose: this is perpetuals with a small account, not a
  # place to use exchange-max leverage.
  max_leverage: 3

  # Keeps each trade's stop-loss distance well inside the approximate
  # liquidation distance (~ 1 / leverage). 0.5 means the stop must trigger
  # at half (or less) of the estimated liquidation move -- the whole point
  # is "the stop-loss fires long before liquidation would".
  liquidation_safety_factor: 0.5

  # Kill switch: once realized+unrealized daily loss reaches this % of the
  # day's starting equity, the bot stops OPENING new trades until the next
  # UTC day. It does not force-close existing positions (their own SL/TP
  # stay resting on the exchange).
  max_daily_loss_pct: 6.0

  # How many positions can be open at once, across all symbols.
  max_concurrent_positions: 1

  # Reject a trade if the computed notional is smaller than this (avoids
  # dust orders the exchange would reject anyway, or that cost more in
  # fees than they can plausibly earn).
  min_order_notional_usd: 10.0

market:
  symbols: ["BTC"]
  timeframe: "15m"        # one of: 1m 3m 5m 15m 30m 1h 2h 4h 8h 12h 1d 3d 1w 1M
  candle_lookback: 200     # bars of history fetched each tick (indicator warm-up)

indicators:
  rsi_period: 14
  rsi_oversold: 30.0
  rsi_overbought: 70.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  bb_tolerance_pct: 0.5    # how close to the band counts as "touching" it

trade:
  stop_loss_pct: 1.5           # adverse move from entry that triggers the stop
  risk_reward_ratio: 1.5        # take-profit distance = stop_loss_pct * this
  slippage_pct: 0.5              # max tolerated slippage on market orders

execution:
  loop_interval_seconds: 60          # how often the loop wakes up and checks the market
  heartbeat_interval_seconds: 300     # how often a status line is logged regardless of activity
  max_consecutive_errors: 5            # after this many failures in a row, auto-pause (safety)
  error_backoff_seconds: 30             # wait time between retries after a failed tick

fees:
  # Used only for logging/estimating net PnL -- check Hyperliquid's current
  # fee schedule for your account tier and update these if they drift.
  taker_fee_pct: 0.035
  maker_fee_pct: 0.01
